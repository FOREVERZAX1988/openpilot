name: 编译并发布预构建包

env:
  BUILD_DIR: "/data/github/openpilot_build"
  OUTPUT_DIR: ${{ github.workspace }}/output
  CI_DIR: ${{ github.workspace }}/release/ci
  SCONS_CACHE_DIR: /data/github/scons_cache
  PUBLIC_REPO_URL: "https://github.com/${{ github.repository }}"
  STAGING_SOURCE_BRANCH: 'master-c3'
  SOURCE_BRANCH: "${{ inputs.branch || github.head_ref || github.ref_name }}"

on:
  push:
    branches: [ master-c3-prebuild, dp-prebuild, ai-prebuild ]
    tags: [ 'release/*' ]
  workflow_run:
    workflows: ["打包预编译分支"]
    types: [completed]
  pull_request_target:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source branch to build'
        required: false
        default: 'master-c3'
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  prepare_strategy:
    name: 准备策略
    runs-on: ubuntu-24.04
    if: >-
      (!contains(github.event_name, 'pull_request') || (github.event.action == 'labeled' && github.event.label.name == 'prebuilt')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    outputs:
      source_branch: ${{ steps.branches.outputs.source_branch }}
      checkout_branch: ${{ steps.branches.outputs.checkout_branch }}
      is_prebuild: ${{ steps.branches.outputs.is_prebuild }}
      environment: ${{ steps.strategy.outputs.environment }}
      new_branch: ${{ steps.strategy.outputs.new_branch }}
      extra_version_identifier: ${{ steps.strategy.outputs.extra_version_identifier }}
      version: ${{ steps.strategy.outputs.version }}
      cancel_publish_in_progress: ${{ steps.strategy.outputs.cancel_publish_in_progress }}
      publish_concurrency_group: ${{ steps.strategy.outputs.publish_concurrency_group }}
      is_stable_branch: ${{ steps.strategy.outputs.is_stable_branch }}
      build: ${{ steps.strategy.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: 确定源分支和检出分支
        id: branches
        run: |
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref_name }}"
          INPUT="${{ inputs.branch }}"
          HEAD="${{ github.head_ref }}"
          WORKFLOW_HEAD="${{ github.event.workflow_run.head_branch }}"
          if [ "$EVENT" = "workflow_run" ] && [ -n "$WORKFLOW_HEAD" ]; then
            SOURCE_BRANCH="$WORKFLOW_HEAD"
            CHECKOUT_BRANCH="${WORKFLOW_HEAD}-prebuild"
            IS_PREBUILD="true"
          elif [[ "$REF" == release/* ]]; then
            SOURCE_BRANCH="$REF"
            CHECKOUT_BRANCH="$REF"
            IS_PREBUILD="false"
          elif [[ "$REF" == *-prebuild ]]; then
            SOURCE_BRANCH="${REF%-prebuild}"
            CHECKOUT_BRANCH="$REF"
            IS_PREBUILD="true"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            SOURCE_BRANCH="${INPUT:-$REF}"
            CHECKOUT_BRANCH="${SOURCE_BRANCH}-prebuild"
            IS_PREBUILD="true"
          else
            SOURCE_BRANCH="${INPUT:-${HEAD:-$REF}}"
            CHECKOUT_BRANCH="$SOURCE_BRANCH"
            IS_PREBUILD="false"
          fi
          echo "source_branch=$SOURCE_BRANCH" >> $GITHUB_OUTPUT
          echo "checkout_branch=$CHECKOUT_BRANCH" >> $GITHUB_OUTPUT
          echo "is_prebuild=$IS_PREBUILD" >> $GITHUB_OUTPUT
          echo "source_branch=$SOURCE_BRANCH checkout_branch=$CHECKOUT_BRANCH is_prebuild=$IS_PREBUILD"
      - name: 提取发布策略
        id: strategy
        run: |
          echo '::group::Strategy Extraction'
          BRANCH="${{ steps.branches.outputs.source_branch }}"
          echo "Current branch: $BRANCH"

          STRATEGY_JSON='${{ vars.DEPLOY_STRATEGY }}'
          CONFIG=$(echo "$STRATEGY_JSON" | jq -r --arg branch "$BRANCH" '
            .configs[] | select(.branch == $branch)
          ')

          BUILD="$(date '+%Y.%m.%d')-${{ github.run_number }}"
          if [[ -z "$CONFIG" || "$CONFIG" == "null" ]]; then
            echo "No exact strategy match found. Falling back to feature/fork logic."
            IS_FORK="${{ github.event.pull_request.head.repo.fork && 'true' || 'false' }}"
            FORK_SUFFIX=$( [[ "$IS_FORK" == "true" ]] && echo "-fork" || echo "" )
            NEW_BRANCH="${BRANCH}${FORK_SUFFIX}-staging"

            echo "new_branch=$NEW_BRANCH" >> $GITHUB_OUTPUT
            echo "version=$BUILD" >> $GITHUB_OUTPUT
            echo "cancel_publish_in_progress=true" >> $GITHUB_OUTPUT
            echo "publish_concurrency_group=publish-${BRANCH}" >> $GITHUB_OUTPUT
            echo "environment=feature-branch" >> $GITHUB_OUTPUT
            echo "extra_version_identifier=feature-branch" >> $GITHUB_OUTPUT
          else
            echo "Matched config: $CONFIG"
            environment=$(echo "$CONFIG" | jq -r '.environment')
            echo "environment=$environment" >> $GITHUB_OUTPUT
            echo "new_branch=$(echo "$CONFIG" | jq -r '.target_branch')" >> $GITHUB_OUTPUT
            cancel="$(echo "$CONFIG" | jq -r '.cancel_publish_in_progress')";
            echo "cancel_publish_in_progress=$( [ "$cancel" = "null" ] && echo "true" || echo $cancel)" >> $GITHUB_OUTPUT
            echo "publish_concurrency_group=publish-${BRANCH}$( [ "$cancel" = "null" ] || [ "$cancel" = "true" ] || echo "${{ github.sha }}" )" >> $GITHUB_OUTPUT

            is_stable_branch="$(echo "$CONFIG" | jq -r '.stable_branch // false')";
            echo "is_stable_branch=$is_stable_branch" >> $GITHUB_OUTPUT

            stable_version=$(cat openpilot/sunnypilot/common/version.h | grep SUNNYPILOT_VERSION | sed -e 's/[^0-9|.]//g');
            echo "version=$([ "$is_stable_branch" = "true" ] && echo "$stable_version" || echo "$BUILD")" >> $GITHUB_OUTPUT
            echo "extra_version_identifier=${environment}" >> $GITHUB_OUTPUT
          fi
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  build:
    name: 构建
    needs: [ prepare_strategy ]
    concurrency:
      group: build-${{ needs.prepare_strategy.outputs.checkout_branch }}
      cancel-in-progress: false
    runs-on: [self-hosted, tici]
    env:
      SOURCE_BRANCH: ${{ needs.prepare_strategy.outputs.source_branch }}
      TMPDIR: /data/tmp
      XDG_CACHE_HOME: /data/github/cache
    outputs:
      new_branch: ${{ needs.prepare_strategy.outputs.new_branch }}
      version: ${{ needs.prepare_strategy.outputs.version }}
      extra_version_identifier: ${{ needs.prepare_strategy.outputs.extra_version_identifier }}
      commit_sha: ${{ steps.set-sha.outputs.sha }}
    if: >-
      needs.prepare_strategy.result == 'success' &&
      (!contains(github.event_name, 'pull_request') ||
      (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
    steps:
      - name: 准备 runner 磁盘空间
        run: |
          mkdir -p /data/tmp /data/github/cache /data/github/scons_cache /data/github/ci "${{ env.BUILD_DIR }}"
          if [ -f "${{ github.workspace }}/release/ci/git_resilient_clone.sh" ]; then
            cp "${{ github.workspace }}/release/ci/git_resilient_clone.sh" /data/github/ci/
            chmod +x /data/github/ci/git_resilient_clone.sh
          fi
          rm -rf /tmp/test-checkout 2>/dev/null || true
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
          df -h /tmp /data

      - name: 检出仓库
        env:
          GITHUB_MIRROR_PREFIXES: ${{ vars.GITHUB_MIRROR_PREFIXES }}
          GITHUB_CLONE_FALLBACK_URLS: ${{ vars.GITHUB_CLONE_FALLBACK_URLS }}
        run: |
          set -euxo pipefail
          export TMPDIR=/data/tmp
          export GIT_LFS_SKIP_SMUDGE=1
          export GITHUB_MIRROR_PREFIXES="${GITHUB_MIRROR_PREFIXES:-https://ghfast.top/,https://ghp.ci/}"
          WS="${{ github.workspace }}"
          REPO="https://github.com/${{ github.repository }}.git"
          BRANCH="${{ needs.prepare_strategy.outputs.checkout_branch }}"
          IS_PREBUILD="${{ needs.prepare_strategy.outputs.is_prebuild }}"
          # actions/checkout leaves workflow files in workspace; clone into a clean dir.
          BOOTSTRAP_DIR="$(mktemp -d /data/tmp/op-bootstrap.XXXXXX)"
          if [ -x /data/github/ci/git_resilient_clone.sh ]; then
            /data/github/ci/git_resilient_clone.sh "$REPO" "$BRANCH" "$BOOTSTRAP_DIR/repo"
          else
            echo "::warning::git_resilient_clone.sh not found; using inline resilient clone"
            git config --global http.version HTTP/1.1
            git config --global http.postBuffer 524288000
            git config --global http.lowSpeedLimit 0
            git config --global http.lowSpeedTime 999999
            git config --global core.compression 0
            CLONE_URLS=()
            if [ -n "${GITHUB_MIRROR_PREFIXES:-}" ]; then
              IFS=',' read -ra prefixes <<< "$GITHUB_MIRROR_PREFIXES"
              for prefix in "${prefixes[@]}"; do
                prefix="${prefix// /}"
                [ -n "$prefix" ] && CLONE_URLS+=("${prefix}${REPO}")
              done
            fi
            CLONE_URLS+=("$REPO")
            if [ -n "${GITHUB_CLONE_FALLBACK_URLS:-}" ]; then
              IFS=',' read -ra fallbacks <<< "$GITHUB_CLONE_FALLBACK_URLS"
              for fallback in "${fallbacks[@]}"; do
                fallback="${fallback// /}"
                [ -n "$fallback" ] && CLONE_URLS+=("$fallback")
              done
            fi
            cloned=false
            for url in "${CLONE_URLS[@]}"; do
              for attempt in 1 2 3; do
                rm -rf "$BOOTSTRAP_DIR/repo"
                echo "Clone attempt ${attempt}/3 from ${url}"
                if git clone --branch "$BRANCH" --single-branch --depth 1 "$url" "$BOOTSTRAP_DIR/repo"; then
                  cloned=true
                  break 2
                fi
                sleep $((attempt * 15))
              done
              echo "::warning::Clone failed from ${url}"
            done
            [ "$cloned" = true ] || { echo "::error::All clone sources failed"; exit 1; }
          fi
          rm -rf "$WS"
          mv "$BOOTSTRAP_DIR/repo" "$WS"
          rm -rf "$BOOTSTRAP_DIR"
          cd "$WS"
          if [ "$IS_PREBUILD" = "true" ]; then
            echo "Using prebuilt source branch; submodules and LFS are already resolved."
          else
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}"
            git submodule sync --recursive
            # Try shallow clones first to reduce transfer size for large submodules (tinygrad),
            # fall back to full clone if a pinned commit is not at the branch tip.
            git submodule update --init --recursive --depth 1 || (sleep 15 && git submodule update --init --recursive --depth 1) || (sleep 15 && git submodule update --init --recursive)
            git lfs pull
          fi
          git log -1 --oneline

      - name: 设置提交 SHA
        id: set-sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: 缓存 SCons
        uses: actions/cache@v4
        with:
          path: ${{env.SCONS_CACHE_DIR}}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.STAGING_SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: 设置环境变量
        id: set-env
        run: |
          echo "new_branch=${{ needs.prepare_strategy.outputs.new_branch }}" >> $GITHUB_OUTPUT
          echo "version=${{ needs.prepare_strategy.outputs.version }}" >> $GITHUB_OUTPUT
          echo "extra_version_identifier=${{ needs.prepare_strategy.outputs.extra_version_identifier }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ steps.set-sha.outputs.sha }}" >> $GITHUB_OUTPUT

          source /etc/profile;
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          export UV_PYTHON_PREFERENCE=managed
          export UV_PYTHON_INSTALL_DIR=${HOME}/uv/python
          export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
          uv sync
          printenv >> $GITHUB_ENV

      - name: 设置构建环境
        run: |
          mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          echo "Starting build stage..."
          echo "BUILD_DIR: ${BUILD_DIR}"
          echo "CI_DIR: ${CI_DIR}"
          echo "VERSION: ${{ steps.set-env.outputs.version }}"
          echo "UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT}"
          echo "VIRTUAL_ENV: ${VIRTUAL_ENV}"
          echo "-------"
          if [[ "${{ runner.debug }}" == "1" ]]; then
            printenv
          fi
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable

      - name: 构建主项目
        run: |
          export PYTHONPATH="$BUILD_DIR"
          ./tools/release/release_files.py | sort | uniq | rsync -rRl${RUNNER_DEBUG:+v} --files-from=- . $BUILD_DIR/
          cd $BUILD_DIR
          ln -sfn msgq_repo/msgq msgq
          ln -sfn opendbc_repo/opendbc opendbc
          ln -sfn rednose_repo/rednose rednose
          ln -sfn teleoprtc_repo/teleoprtc teleoprtc
          ln -sfn tinygrad_repo/tinygrad tinygrad
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py
          echo "Building sunnypilot's modeld_v2..."
          scons -j$(nproc) cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/sunnypilot/modeld_v2
          echo "Building sunnypilot's locationd..."
          scons -j2 cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/sunnypilot/selfdrive/locationd
          echo "Building openpilot's locationd..."
          scons -j1 cache_dir=${{env.SCONS_CACHE_DIR}} --minimal openpilot/selfdrive/locationd
          echo "Building rest of sunnypilot"
          scons -j$(nproc) cache_dir=${{env.SCONS_CACHE_DIR}} --minimal
          touch ${BUILD_DIR}/prebuilt

      - name: 准备输出
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am${RUNNER_DEBUG:+v} \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/openpilot/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude='${{env.SCONS_CACHE_DIR}}' \
            --exclude='**/.git/' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='openpilot/selfdrive/modeld/models/*.onnx*' \
            --exclude='openpilot/sunnypilot/modeld*/models/*.onnx*' \
            --exclude='openpilot/third_party/*x86*' \
            --exclude='openpilot/third_party/*Darwin*' \
            --delete-excluded \
            --chown=comma:comma \
            ${BUILD_DIR}/ ${OUTPUT_DIR}/

      - name: 打包 Tar.gz
        run: |
          tar czf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }} .
          ls -la prebuilt.tar.gz

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz

      - name: 重新启用节能
        if: always()
        run: |
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable


  publish:
    name: 发布
    concurrency:
      group: ${{ needs.prepare_strategy.outputs.publish_concurrency_group }}
      cancel-in-progress: ${{ needs.prepare_strategy.outputs.cancel_publish_in_progress == 'true' }}
    if: >-
      needs.build.result == 'success' &&
      needs.prepare_strategy.result == 'success' &&
      (!contains(github.event_name, 'pull_request') ||
      (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
    needs: [ build, prepare_strategy ]
    runs-on: ubuntu-24.04
    environment: ${{ needs.prepare_strategy.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_strategy.outputs.checkout_branch }}
          fetch-depth: 1

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: 解压预构建包
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: 配置 Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 发布编译分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ${{ env.CI_DIR }}/publish.sh \
            "${{ github.workspace }}" \
            "${{ env.OUTPUT_DIR }}" \
            "${{ needs.build.outputs.new_branch }}" \
            "${{ needs.build.outputs.version }}" \
            "https://x-access-token:${{github.token}}@github.com/${{ github.repository }}.git" \
            "${{ needs.build.outputs.extra_version_identifier }}"

      - name: 打标签
        if: ${{ needs.prepare_strategy.outputs.is_stable_branch == 'true' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')) }}
        run: |
          TAG="${{ needs.prepare_strategy.outputs.environment }}/${{ needs.prepare_strategy.outputs.version }}/${{ needs.prepare_strategy.outputs.build }}"
          git tag -f -a ${TAG} -m "${{ needs.prepare_strategy.outputs.environment }} @ ${{ needs.prepare_strategy.outputs.version }} of build ${{ needs.build.outputs.build }}."
          git push -f origin ${TAG}

  manage-pr-labels:
    name: 移除 prebuilt 标签
    runs-on: ubuntu-latest
    if: (always() && contains(github.event_name, 'pull_request') && (github.event.action == 'labeled' && github.event.label.name == 'prebuilt'))
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'prebuilt'
            });
