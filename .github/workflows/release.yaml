name: 打包预编译分支

on:
  push:
    branches: [ master-c3, tn-c3 ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch to strip and publish
        required: true
        type: choice
        options: [ master-c3, tn-c3 ]

permissions:
  contents: write

jobs:
  plan:
    name: 规划发布
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.plan.outputs.source }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SRC="${{ github.event.inputs.source_branch }}"
          else
            SRC="${{ github.ref_name }}"
          fi
          case "$SRC" in
            master-c3) TGT=master-c3-prebuild ;;
            dp) TGT=dp-prebuild ;;
            ai) TGT=ai-prebuild ;;
            *)
              echo "Unsupported branch: $SRC"
              exit 1
              ;;
          esac
          echo "source=$SRC" >> "$GITHUB_OUTPUT"
          echo "target=$TGT" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ needs.plan.outputs.source }} → ${{ needs.plan.outputs.target }}
    needs: plan
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.plan.outputs.target }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: 推送精简源码分支
        env:
          BRANCH: ${{ needs.plan.outputs.target }}
        run: ./tools/release/build_stripped.sh
