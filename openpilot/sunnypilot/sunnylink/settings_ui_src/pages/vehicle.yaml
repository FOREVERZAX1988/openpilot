# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false

- id: volkswagen
  title: Volkswagen / Porsche Settings
  description: ''
  items:
  - key: MacanStartupGapSync
    widget: toggle
    title: Macan Startup Distance Sync
    description: 'After ignition, while parked & ACC standby, send DIST +/- pulses so the stock ACC ECU follows your remembered driving style (4=comfortable). Default off; only effective on Macan.'
  - key: MacanStartStop
    widget: toggle
    title: Macan Stop and Go
    description: 'Vision model decides when to start; openpilot sends RESUME to release the stock parking hold.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanJerkLimitEnable
    widget: toggle
    title: Macan Accel Jerk Limit
    description: 'Master switch for the acceleration change-rate (jerk) limit. When off, the limit value is ignored.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanJerkLimit
    widget: multiple_button
    title: Accel Jerk Limit Value (m/s^3)
    description: 'Limits how fast the acceleration request can change. Lower = smoother (less surge); higher = more responsive. 0 = off. Decel is allowed 2.2x faster for safety.'
    options:
    - value: 0
      label: 'Off'
    - value: 1.2
      label: '1.2'
    - value: 1.5
      label: '1.5'
    - value: 1.8
      label: '1.8'
    - value: 2.0
      label: '2.0'
    - value: 2.5
      label: '2.5'
    enablement:
    - $ref: '#/macros/offroad'
    - {type: param, key: MacanJerkLimitEnable, equals: true}
  - key: MacanAccelLimit
    widget: multiple_button
    title: Macan Accel Limit (m/s^2)
    description: 'Clamps the acceleration request magnitude. 0 = factory curve.'
    options:
    - value: 0
      label: 'Off'
    - value: 0.8
      label: '0.8'
    - value: 1.0
      label: '1.0'
    - value: 1.2
      label: '1.2'
    - value: 1.5
      label: '1.5'
    - value: 2.0
      label: '2.0'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanAccelDeadzoneEnable
    widget: toggle
    title: Macan Accel Deadzone Enable
    description: 'Master switch. Off = deadzone fully disabled (value kept but ignored).'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanAccelDeadzone
    widget: multiple_button
    title: Macan Accel Deadzone (m/s^2)
    description: 'Zeroes aTarget inside +/- deadzone to filter MPC jitter. 0 = off.'
    options:
    - value: 0
      label: 'Off'
    - value: 0.05
      label: '0.05'
    - value: 0.1
      label: '0.1'
    - value: 0.15
      label: '0.15'
    - value: 0.2
      label: '0.2'
    enablement:
    - $ref: '#/macros/offroad'
    - {type: param, key: MacanAccelDeadzoneEnable, equals: true}
  - key: MacanCornerLimit
    widget: toggle
    title: Macan Corner Limit
    description: 'Lowers the longitudinal limit in corners (wheel angle > 5 deg).'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanSlopeComp
    widget: toggle
    title: Macan Slope Compensation
    description: 'Applies decel on descents / extra pull on ascents.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanSlopeCompUnlimited
    widget: toggle
    title: Slope Comp Unlimited (Macan)
    description: 'Release the factory torque limit for slope compensation.'
    enablement:
    - $ref: '#/macros/offroad'
    - {type: param, key: MacanSlopeComp, equals: true}
  - key: MacanSteerParams
    widget: toggle
    title: Dynamic Ratio Tuning (Macan)
    description: 'Experimental dynamic ratio coefficients for Macan (MLB).'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanRadarFusion
    widget: toggle
    title: Radar Fusion (Macan)
    description: 'Uses the stock ACC radar (bus2 distance + lead speed) to correct the vision lead. Reduces follow jitter.'
    enablement:
    - $ref: '#/macros/offroad'
