# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaAutoHold
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: Auto Brake Hold FOR TSS2 HYBRID CARS'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaBrakeOnset
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: soft brake onset, overshoot limit and regen hand-over'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaEnhancedBsm
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: Prius TSS2 BSM and some tssp'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaTSS2Long
    widget: toggle
    needs_onroad_cycle: true
    title: 'Toyota: custom longitudinal for TSS2'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaDriveMode
    widget: toggle
    needs_onroad_cycle: true
    title: Enable drive mode btn link
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false

- id: volkswagen
  title: Volkswagen / Porsche Settings
  description: ''
  items:
  - key: MacanStartupGapSync
    widget: toggle
    title: Macan Distance Sync Direction
    description: 'ON: openpilot style wins - after ignition send DIST +/- pulses so the stock ACC follows your remembered style (e.g. 4 bars = Comfortable). OFF: car wins - openpilot resets its style to the car default (3 bars = Standard). Effective on Macan only.'
  - key: MacanStartStop
    widget: toggle
    title: Macan Stop and Go
    description: 'Vision model decides when to start; openpilot sends RESUME to release the stock parking hold.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanSlopeComp
    widget: toggle
    title: Macan Slope Compensation
    description: 'Applies decel on descents / extra pull on ascents.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanSlopeCompUnlimited
    widget: toggle
    title: Slope Comp Unlimited (Macan)
    description: 'Release the factory torque limit for slope compensation.'
    enablement:
    - $ref: '#/macros/offroad'
    - {type: param, key: MacanSlopeComp, equals: true}
  - key: MacanRadarFusion
    widget: toggle
    title: Radar Fusion (Macan)
    description: 'Uses the stock ACC radar (bus2 distance + lead speed) to correct the vision lead. Reduces follow jitter.'
    enablement:
    - $ref: '#/macros/offroad'
  - key: MacanVerzBridge
    widget: toggle
    title: Macan Verz Bridge
    description: 'When ON, the bridge smooths the requested deceleration with a percentage-based ramp (step = 1.25% x |verz|) - softens abrupt OP-initiated braking and kills breath/pulse. When OFF, verz passes through un-smoothed. Deep braking (<= -1.5) and OEM brake requests always pass through for safety.'
    enablement:
    - $ref: '#/macros/offroad'
