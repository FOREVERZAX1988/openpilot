<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>carrot 通知</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b1016">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #0b1016; color: #e6edf3;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { font-size: 14px; line-height: 1.5; margin: 8px 0; }
  .hint { color: #8b98a5; font-size: 13px; }
  .warn { color: #f0b429; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
  button { flex: 1 1 140px; padding: 12px 14px; border-radius: 10px; border: 1px solid #26313c;
           background: #16202a; color: #e6edf3; font-size: 15px; }
  button:active { background: #22303c; }
  button:disabled { opacity: .45; }
  pre { margin: 0; padding: 12px; border-radius: 10px; background: #101820; color: #9ad1a0;
        font-size: 12px; min-height: 120px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>carrot 通知</h1>
<p id="state">正在检查…</p>
<p class="hint" id="secure"></p>
<div class="row">
  <button id="enable">开启通知</button>
  <button id="test">发送测试通知</button>
  <button id="disable">关闭通知</button>
</div>
<pre id="log"></pre>
<script>
'use strict';
const logEl = document.getElementById('log');
const stateEl = document.getElementById('state');
const log = (msg) => { logEl.textContent += msg + '\n'; };

function b64urlToBytes(value) {
  const pad = '='.repeat((4 - (value.length % 4)) % 4);
  const raw = atob((value + pad).replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function readStatus() {
  const response = await fetch('/api/push/status', { cache: 'no-store' });
  return response.json();
}

async function currentSubscription() {
  if (!('serviceWorker' in navigator)) return null;
  const registration = await navigator.serviceWorker.getRegistration('/sw.js');
  if (!registration) return null;
  return registration.pushManager.getSubscription();
}

async function refresh() {
  const status = await readStatus();
  const sub = await currentSubscription();
  stateEl.textContent = '设备端订阅数：' + status.subscriptions + '，本机：' + (sub ? '已订阅' : '未订阅');
}

async function enable() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    log('这个浏览器页面不支持推送：Service Worker / Push 需要 HTTPS 或 localhost。');
    return;
  }
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') { log('通知权限被拒绝：' + permission); return; }
  const registration = await navigator.serviceWorker.register('/sw.js');
  const status = await readStatus();
  let sub = await registration.pushManager.getSubscription();
  if (!sub) {
    sub = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64urlToBytes(status.vapidPublicKey),
    });
    log('已向浏览器申请到订阅端点');
  }
  const response = await fetch('/api/push/subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sub.toJSON()),
  });
  log('设备端登记：' + JSON.stringify(await response.json()));
  await refresh();
}

async function sendTest() {
  const response = await fetch('/api/push/test', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: 'carrot', body: '测试通知 ' + new Date().toLocaleTimeString() }),
  });
  log('测试发送：' + JSON.stringify(await response.json()));
}

async function disable() {
  const sub = await currentSubscription();
  if (!sub) { log('本机没有订阅'); return; }
  const endpoint = sub.endpoint;
  await sub.unsubscribe();
  const response = await fetch('/api/push/unsubscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint }),
  });
  log('已取消：' + JSON.stringify(await response.json()));
  await refresh();
}

document.getElementById('enable').addEventListener('click', () => enable().catch((e) => log('失败：' + e)));
document.getElementById('test').addEventListener('click', () => sendTest().catch((e) => log('失败：' + e)));
document.getElementById('disable').addEventListener('click', () => disable().catch((e) => log('失败：' + e)));

if (window.isSecureContext === false) {
  document.getElementById('secure').className = 'hint warn';
  document.getElementById('secure').textContent =
    '当前是 http 局域网地址：可以看订阅状态，但浏览器不会注册 Service Worker。' +
    '要在手机上真正收到推送，请用 https 地址打开本页（例如 carrot 里的 cloudflared 隧道域名）。';
} else {
  document.getElementById('secure').textContent = '安全上下文正常，可以直接开启通知。';
}
refresh().catch((e) => { stateEl.textContent = '读取状态失败：' + e; });
</script>
</body>
</html>
